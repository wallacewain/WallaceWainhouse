<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>·</title>
  <style>
    :root { --bg: #0e0e10; --text: #fafafa; --muted: #a1a1aa; --accent: #6366f1; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem; text-align: center;
      overflow: hidden;
    }
    .msg {
      font-size: clamp(1.4rem, 6vw, 2.6rem); font-weight: 600;
      line-height: 1.35; letter-spacing: -0.01em;
      opacity: 0; animation: fade 1.6s ease forwards 0.2s;
    }
    .msg .accent { background: linear-gradient(135deg, var(--accent), #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { margin-top: 1.1rem; color: var(--muted); font-size: 0.95rem; opacity: 0; animation: fade 1.6s ease forwards 1s; }
    @keyframes fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <div>
    <p class="msg">hi <span class="accent">rou</span> &mdash; no one is likely to find this</p>
    <p class="sub">but you did ♥</p>
  </div>
</body>
</html>
